[package]
name = "electrum-private-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A fail-closed Electrum protocol proxy for pluggable private Bitcoin transaction broadcasting"
license = "Apache-2.0"
repository = "https://github.com/metaforismo/electrum-private-relay"
readme = "README.md"
keywords = ["bitcoin", "electrum", "privacy", "tor"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-socks = "0.5.3"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
