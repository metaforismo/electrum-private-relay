name: Release candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native double-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python: python3
          - os: macos-latest
            target: aarch64-apple-darwin
            python: python3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release-candidate tooling
        run: |
          ${{ matrix.python }} scripts/test_reproducible_release.py
          ${{ matrix.python }} scripts/test_release_candidate_once.py

      - name: Build twice, check packaged binary, and publish once
        run: >-
          ${{ matrix.python }} scripts/release_candidate_once.py
          --target ${{ matrix.target }}
          --output-dir dist

      - name: Upload target candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest main-branch candidate archives
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download target candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-candidate-*
          path: dist
          merge-multiple: true

      - name: Verify checksum sidecars
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          archives = sorted(Path("dist").glob("*.zip"))
          if len(archives) != 3:
              raise SystemExit(f"expected three target archives, found {len(archives)}")
          for archive in archives:
              sidecar = archive.with_name(f"{archive.name}.sha256")
              fields = sidecar.read_text(encoding="ascii").strip().split()
              if len(fields) != 2 or fields[1] != archive.name:
                  raise SystemExit(f"invalid checksum sidecar: {sidecar}")
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              if fields[0] != digest:
                  raise SystemExit(f"checksum mismatch: {archive}")
          PY

      - name: Generate SLSA provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
