name: Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet-profiles:
    name: Wallet protocol profiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.96.0

      - name: Build release binary
        run: cargo build --locked --release

      - name: Check Python harness syntax
        run: python3 -m compileall -q tests

      - name: Run source-derived wallet profiles
        run: >-
          python3 tests/wallet_protocol_compat.py
          --binary target/release/electrum-private-relay

  regtest:
    name: Bitcoin Core regtest E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.96.0

      - name: Build release binary
        run: cargo build --locked --release

      - name: Run real Bitcoin Core regtest broadcast
        run: >-
          python3 tests/regtest_e2e.py
          --binary target/release/electrum-private-relay
