name: Tor smoke

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tor-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onion:
    name: Real v3 onion broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.96.0

      - name: Build release binary
        run: cargo build --locked --release

      - name: Route a broadcast through a real v3 onion
        run: >-
          python3 tests/tor_onion_smoke.py
          --binary target/release/electrum-private-relay
