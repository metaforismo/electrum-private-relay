name: Feature request
description: Propose a focused capability or relay adapter
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and trust boundaries
      description: Identify providers, credentials, correlation, fallback, logging, and network exposure.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Primary documentation or test evidence
